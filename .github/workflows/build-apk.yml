name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit-Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Grafik-Vorschau hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-previews
          path: app/build/previews/
          if-no-files-found: ignore

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk pv-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pv-widget-apk
          path: pv-widget.apk

      # Fester Release "latest": Download-Link bleibt immer gleich, ideal fürs Handy.
      - name: Release "latest" aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aktuelle Test-Version
          body: "Automatisch gebaut aus ${{ github.sha }}. Am Handy: pv-widget.apk antippen, installieren (Installation aus unbekannten Quellen erlauben)."
          prerelease: true
          make_latest: false
          files: pv-widget.apk
